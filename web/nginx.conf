server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 160m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 190s; }
    location = /health { proxy_pass http://api:8000/health; }
    location / { try_files $uri $uri/ /index.html; }
}
