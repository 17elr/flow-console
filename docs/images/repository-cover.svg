<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Flow Console — 商品运营工作台</title>
  <desc id="desc">从商品资料、人工审核到后台执行与平台核验。Java 与 Vue 构建的可追溯商品工作流。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b22"/><stop offset="1" stop-color="#1c4938"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c8e6ce" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#background)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <path d="M748 0V440" stroke="#76a68a" stroke-opacity=".18"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="56" y="50" width="8" height="8" rx="4" fill="#b9e4b8"/>
    <text x="78" y="61" fill="#bfd2c4" font-size="13" letter-spacing="2.7">COMMERCE OPERATIONS WORKSPACE</text>
    <text x="54" y="165" fill="#f4f7ed" font-size="74" font-weight="650" letter-spacing="-3">Flow Console</text>
    <text x="58" y="224" fill="#f2f5e9" font-size="29" font-weight="500">把商品上架的每一步，变得清楚可控。</text>
    <text x="58" y="265" fill="#adc6b6" font-size="17">资料整理 · 素材版本 · 人工审核 · 可靠执行</text>
    <path d="M58 307H684" stroke="#668d76" stroke-opacity=".45"/>
    <text x="58" y="347" fill="#d8e5d9" font-size="14" letter-spacing="1">JAVA 17</text>
    <circle cx="151" cy="342" r="2" fill="#7f9f89"/>
    <text x="171" y="347" fill="#d8e5d9" font-size="14" letter-spacing="1">VUE 3</text>
    <circle cx="249" cy="342" r="2" fill="#7f9f89"/>
    <text x="269" y="347" fill="#d8e5d9" font-size="14" letter-spacing="1">RABBITMQ</text>
    <circle cx="378" cy="342" r="2" fill="#7f9f89"/>
    <text x="398" y="347" fill="#d8e5d9" font-size="14" letter-spacing="1">MYSQL + REDIS</text>
    <text x="58" y="399" fill="#89aa95" font-size="12" letter-spacing="1.4">ORGANIZE. REVIEW. EXECUTE. VERIFY.</text>

    <text x="800" y="62" fill="#a8c3b2" font-size="12" letter-spacing="2.2">ONE CLEAR WORKFLOW</text>
    <path d="M834 123V341" stroke="#668c75" stroke-width="2" stroke-dasharray="4 6"/>
    <g>
      <rect x="799" y="88" width="426" height="62" rx="12" fill="#224d3a" stroke="#52785f" stroke-opacity=".7"/>
      <rect x="815" y="103" width="32" height="32" rx="8" fill="#345f47"/>
      <text x="831" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#cce6ce">01</text>
      <text x="865" y="114" font-size="16" font-weight="600" fill="#f0f5e9">整理商品</text>
      <text x="865" y="135" font-size="11" fill="#b3cab9">商品事实、规格与素材统一管理</text>
      <text x="1198" y="124" text-anchor="end" font-size="11" fill="#b9d8b9" letter-spacing="1">IMPORT</text>
    </g>
    <g>
      <rect x="799" y="164" width="426" height="62" rx="12" fill="#dfeacb"/>
      <rect x="815" y="179" width="32" height="32" rx="8" fill="#bfd3aa"/>
      <text x="831" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#254333">02</text>
      <text x="865" y="190" font-size="16" font-weight="650" fill="#1e382a">人工审核</text>
      <text x="865" y="211" font-size="11" fill="#48614b">批准绑定内容版本，修改后重新审核</text>
      <text x="1198" y="200" text-anchor="end" font-size="11" fill="#49694c" letter-spacing="1">REVIEW</text>
    </g>
    <g>
      <rect x="799" y="240" width="426" height="62" rx="12" fill="#224d3a" stroke="#52785f" stroke-opacity=".7"/>
      <rect x="815" y="255" width="32" height="32" rx="8" fill="#345f47"/>
      <text x="831" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#cce6ce">03</text>
      <text x="865" y="266" font-size="16" font-weight="600" fill="#f0f5e9">后台执行</text>
      <text x="865" y="287" font-size="11" fill="#b3cab9">任务持久化、账号限流、受控重试</text>
      <text x="1198" y="276" text-anchor="end" font-size="11" fill="#b9d8b9" letter-spacing="1">EXECUTE</text>
    </g>
    <g>
      <rect x="799" y="316" width="426" height="62" rx="12" fill="#224d3a" stroke="#52785f" stroke-opacity=".7"/>
      <rect x="815" y="331" width="32" height="32" rx="8" fill="#345f47"/>
      <text x="831" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#cce6ce">04</text>
      <text x="865" y="342" font-size="16" font-weight="600" fill="#f0f5e9">核验结果</text>
      <text x="865" y="363" font-size="11" fill="#b3cab9">草稿、导入包与正式发布分别记录</text>
      <text x="1198" y="352" text-anchor="end" font-size="11" fill="#b9d8b9" letter-spacing="1">VERIFY</text>
    </g>
  </g>
</svg>
