name: Legacy manual regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: API regression tests
        working-directory: apps/api
        run: python -m pytest -q --junitxml=../../.runtime/pytest.xml
      - name: Reproduce isolated local demo
        run: python scripts/demo_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-and-demo-evidence
          path: |
            .runtime/pytest.xml
            docs/evidence/demo-run.json
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
